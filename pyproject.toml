[project]
name = "nowcast"
version = "0.1.0"
description = "Alt-data (Wikipedia pageviews) nowcast of quarterly revenue growth, point-in-time."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.13.0",
    "duckdb>=1.1",
    "httpx>=0.27",
    "matplotlib>=3.11.2",
    "pandas>=2.2",
    "pydantic>=2.14.4",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "statsmodels>=0.15.0",
    "tabulate>=0.10.0",
]

[project.scripts]
nowcast = "nowcast.cli:main"

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nowcast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
